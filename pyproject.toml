[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rozum-os"
version = "0.2.0"
description = "Executable ROZUM_AI_v2.1 receiver, HTTP transport, and conformance harness"
readme = "runtime/README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Vladyslav Koshelev"}]
dependencies = [
  "cryptography==46.0.0",
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",
  "rfc8785==0.1.4",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[project.scripts]
rozum = "rozum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rozum = ["resources/*.json"]
